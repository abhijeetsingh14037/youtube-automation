name: Render Video

on:
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Write story text to file
        env:
          STORY_TEXT: ${{ github.event.client_payload.story_text }}
        run: node -e "require('fs').writeFileSync('story.txt', process.env.STORY_TEXT)"

      - name: Generate audio with edge-tts
        run: |
          mkdir -p public
          edge-tts --voice hi-IN-MadhurNeural --rate=+15% --file story.txt --write-media public/audio.mp3

      - name: Write props to file
        run: echo '${{ toJSON(github.event.client_payload.clips_data) }}' > props.json

      - name: Render video
        run: npx remotion render MyComp out/video.mp4 --props=props.json

      - name: Publish video as release asset
        id: videolink
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-${{ github.run_id }}"
          gh release create "$TAG" out/video.mp4 --title "$TAG" --notes "auto render" --repo "${{ github.repository }}"
          echo "link=https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" >> $GITHUB_OUTPUT

      - name: Upload to YouTube
        env:
          CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ toJSON(github.event.client_payload.title) }}
          VIDEO_DESCRIPTION: ${{ toJSON(github.event.client_payload.description) }}
          VIDEO_TAGS: ${{ toJSON(github.event.client_payload.tags) }}
        run: |
          set -euo pipefail

          ACCESS_TOKEN=$(curl -s --request POST \
            --data "client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET&refresh_token=$REFRESH_TOKEN&grant_type=refresh_token" \
            https://oauth2.googleapis.com/token | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "undefined" ]; then
            echo "Access token nahi mila, token refresh fail hua"
            exit 1
          fi

          node -e "
          const fs = require('fs');
          const body = { snippet: { title: JSON.parse(process.env.VIDEO_TITLE), description: JSON.parse(process.env.VIDEO_DESCRIPTION), tags: JSON.parse(process.env.VIDEO_TAGS) }, status: { privacyStatus: 'private' } };
          fs.writeFileSync('snippet.json', JSON.stringify(body));
          "

          FILESIZE=$(stat -c%s out/video.mp4)

          curl -s -D headers.txt -o /dev/null \
            -X POST "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $FILESIZE" \
            -d @snippet.json

          echo "--- Initiation response headers ---"
          cat headers.txt

          UPLOAD_URL=$(grep -i "^location:" headers.txt | sed 's/[Ll]ocation: //I' | tr -d '\r\n')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Upload URL nahi mili, upload session start hi nahi hua"
            exit 1
          fi

          echo "Uploading to: $UPLOAD_URL"

          HTTP_STATUS=$(curl -s -o upload_response.json -w "%{http_code}" -X PUT "$UPLOAD_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: video/mp4" \
            --upload-file out/video.mp4)

          echo "--- Upload response (status: $HTTP_STATUS) ---"
          cat upload_response.json

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Video binary upload fail hua"
            exit 1
          fi

          echo "Video successfully uploaded"

      - name: Notify Activepieces
        env:
          VIDEO_LINK: ${{ steps.videolink.outputs.link }}
        run: |
          node -e "
          const https = require('https');
          const data = JSON.stringify({ video_url: process.env.VIDEO_LINK, status: 'uploaded_to_youtube' });
          const req = https.request('https://cloud.activepieces.com/api/v1/webhooks/ELZdlpVlxiMBZlGW9nCaX', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          req.write(data);
          req.end();
          "