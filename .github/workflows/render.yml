name: Render Video

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Write story text to file
        env:
          STORY_TEXT: ${{ github.event.client_payload.story_text }}
        run: node -e "require('fs').writeFileSync('story.txt', process.env.STORY_TEXT)"

      - name: Generate audio with edge-tts
        run: |
          mkdir -p public
          edge-tts --voice hi-IN-MadhurNeural --rate=+15% --file story.txt --write-media public/audio.mp3

      - name: Write props to file
        run: echo '${{ toJSON(github.event.client_payload.clips_data) }}' > props.json

      - name: Render video
        run: npx remotion render MyComp out/video.mp4 --props=props.json

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4