name: Render Video

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write props to file
        run: echo '${{ toJSON(github.event.client_payload.clips_data) }}' > props.json

      - name: Render video
        run: npx remotion render MyComp out/video.mp4 --props=props.json

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4